services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: service_requests_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data # In-memory: fast and clean on every run

  api:
    build: ./backend
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the Docker network the database host is "db", not "localhost"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    profiles: ["full"]
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
